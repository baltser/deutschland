services:
  postgres:
    image: postgres:16-alpine
    container_name: dnz_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dnz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: ghcr.io/baltser/deutschland:latest
    container_name: dnz_app
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL}
      UCALLER_SECRET_KEY: ${UCALLER_SECRET_KEY}
      UCALLER_SERVICE_ID: ${UCALLER_SERVICE_ID}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_NAME: ${ADMIN_NAME}
    networks:
      - dnz-network
    command: sh -c "npx prisma db push && node .output/server/index.mjs"
#    command: sh -c "npx prisma migrate deploy && node .output/server/index.mjs"
#    command: sh -c "npx prisma db push --accept-data-loss && node .output/server/index.mjs"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: cr.yandex/mirror/minio/minio:latest
    container_name: dnz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dnz_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dnz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-I", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: dnz_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dnz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  dnz_minio_data:
  redis_data:

networks:
  dnz-network:
    driver: bridge
