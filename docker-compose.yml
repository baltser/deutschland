services:
  postgres:
    image: postgres:16-alpine
    container_name: dnz_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dnz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ghcr.io/baltser/deutschland:latest
    container_name: dnz_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      MINIO_ENDPOINT: http://dnz-minio:9000
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    networks:
      - dnz-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: cr.yandex/mirror/minio/minio:latest
    container_name: dnz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dnz_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dnz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-I", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  dnz_minio_data:

networks:
  dnz-network:
    driver: bridge
